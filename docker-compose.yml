# Production stack — deployed as a single Coolify "Docker Compose" resource.
#
# The application and migration services share one prebuilt GHCR image and
# deliberately have no `build:` key: that is what stops the shared Coolify host
# from compiling the app on every deploy. The image is produced by
# .github/workflows/publish.yaml on every push to main.
#
# Nothing environment-specific is baked into the image, so the same build can
# back several Coolify applications. `IMAGE_TAG` selects which build each one
# runs: leave it unset to track `latest`, or pin it to a commit SHA (set
# IMAGE_TAG in the application's environment variables) to promote a build that
# has already been verified elsewhere. A future test environment is then a
# second Coolify application pointed at this same compose file.
#
# To build the same images locally (or in CI), overlay docker-compose.build.yml:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml \
#     --profile production up --build -d
#
# When copying this template into a new project, change `ghcr.io/c4g/template`
# below and IMAGE in .github/workflows/publish.yaml to the new image name.
services:
  template-db:
    image: postgres:17
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    environment:
      - POSTGRES_PASSWORD=${DATABASE_PW}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - template-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Database migrations (production only).
  #
  # Runs from the SAME image as the application, with a different command — the
  # image ships the Prisma CLI for exactly this (see Dockerfile). A dedicated
  # migration image would be a second thing to build, publish, keep public and
  # pull, for one command.
  template-migrations:
    image: ghcr.io/c4g/template:${IMAGE_TAG:-latest}
    command: ["node", "/node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment:
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PW}@template-db:5432/${DATABASE_NAME}
    restart: "no"
    depends_on:
      template-db:
        condition: service_healthy
    profiles:
      - production

  # Next.js application (production only)
  template-app:
    image: ghcr.io/c4g/template:${IMAGE_TAG:-latest}
    ports:
      - "${APP_PORT-3001:}3000"
    environment:
      - DATABASE_URL=postgresql://${DATABASE_USER}:${DATABASE_PW}@template-db:5432/${DATABASE_NAME}
      - DATABASE_PW=${DATABASE_PW}
      - DATABASE_USER=${DATABASE_USER}
      - DATABASE_NAME=${DATABASE_NAME}
      - DATABASE_HOST=template-db
      - DATABASE_PORT=5432
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
    command: node server.js
    depends_on:
      template-db:
        condition: service_healthy
      template-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 2m
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s
    profiles:
      - production

volumes:
  template-db-data: