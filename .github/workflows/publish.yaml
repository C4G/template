name: Publish Images

# Builds the application and migration images and pushes them to GHCR so the
# Coolify host pulls finished images instead of compiling them. Building on the
# shared server ties up CPU and disk for every other application on the box;
# doing it here keeps deploys to a pull-and-restart.
#
# docker-compose.yml has no `build:` keys for these services on purpose — see
# the comment at the top of that file.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must be lowercase — GHCR rejects mixed-case image names, and the org is "C4G".
  # Keep in sync with the `image:` values in docker-compose.yml.
  IMAGE_BASE: ghcr.io/c4g/template

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push migrations image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.migrations
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-migrations:latest
            ${{ env.IMAGE_BASE }}-migrations:${{ github.sha }}
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # No build-args: nothing environment-specific may be baked into the
          # image, so one build can serve production and any future test app.
          # See the comment in Dockerfile.
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          tags: |
            ${{ env.IMAGE_BASE }}-app:latest
            ${{ env.IMAGE_BASE }}-app:${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### Images published"
            echo ''
            echo '```'
            echo "${IMAGE_BASE}-app:latest"
            echo "${IMAGE_BASE}-app:${GITHUB_SHA}"
            echo "${IMAGE_BASE}-migrations:latest"
            echo "${IMAGE_BASE}-migrations:${GITHUB_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Deploying from here (rather than letting Coolify redeploy on git push)
      # avoids a race where Coolify pulls `:latest` before this workflow has
      # finished pushing it. Skipped automatically until both values exist, so a
      # copy of this template does not redeploy the template's own application.
      # The secret is surfaced through `env` because the `secrets` context is
      # not available in a step-level `if:`.
      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
        if: ${{ env.COOLIFY_TOKEN != '' && env.COOLIFY_APP_UUID != '' }}
        run: |
          curl -fsS -X GET \
            "https://coolify.c4g.dev/api/v1/deploy?uuid=${COOLIFY_APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
