name: Publish Image

# Builds the application image and pushes it to GHCR so the Coolify host pulls a
# finished image instead of compiling it. Building on the shared server ties up
# CPU and disk for every other application on the box; doing it here keeps
# deploys to a pull-and-restart.
#
# One image covers both compose services: it ships the Prisma CLI, so the
# migration service runs it with a different command. docker-compose.yml has no
# `build:` keys on purpose — see the comment at the top of that file.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must be lowercase — GHCR rejects mixed-case image names, and the org is "C4G".
  # Keep in sync with the `image:` value in docker-compose.yml.
  IMAGE: ghcr.io/c4g/template

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # No build-args: nothing environment-specific may be baked into the
          # image, so one build can serve production and any future test app.
          # See the comment in Dockerfile.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ''
            echo '```'
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${GITHUB_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Deploying from here (rather than letting Coolify redeploy on git push)
      # avoids a race where Coolify pulls `:latest` before this workflow has
      # finished pushing it. Skipped automatically until both values exist, so a
      # copy of this template does not redeploy the template's own application.
      # The secret is surfaced through `env` because the `secrets` context is
      # not available in a step-level `if:`.
      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
        if: ${{ env.COOLIFY_TOKEN != '' && env.COOLIFY_APP_UUID != '' }}
        run: |
          curl -fsS -X GET \
            "https://coolify.c4g.dev/api/v1/deploy?uuid=${COOLIFY_APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
