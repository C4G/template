name: Publish Image

# Builds the image in CI so the shared Coolify host only pulls and restarts.
# One image covers both compose services; the migration one just runs a different command.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  # Must be lowercase — GHCR rejects mixed-case image names, and the org is "C4G".
  # Keep in sync with the `image:` value in docker-compose.yml.
  IMAGE: ghcr.io/c4g/template

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # No build-args, so one image works in every environment. See Dockerfile.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ''
            echo '```'
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${GITHUB_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Deploy from here, not Coolify's git webhook, so it cannot pull `:latest`
      # mid-push. Skipped until both values exist (secrets need `env` for `if:`).
      - name: Trigger Coolify deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
        if: ${{ env.COOLIFY_TOKEN != '' && env.COOLIFY_APP_UUID != '' }}
        run: |
          curl -fsS -X GET \
            "https://coolify.c4g.dev/api/v1/deploy?uuid=${COOLIFY_APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
